name: Windows installer

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v?(\d+\.\d+\.\d+)$') {
            throw 'Release tag must be MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH (for example, 0.4.0 or v0.4.0).'
          }
          $version = $Matches[1]
          [xml]$project = Get-Content src/Rambl.csproj
          $versionNode = $project.SelectSingleNode('/Project/PropertyGroup/ApplicationDisplayVersion')
          $projectVersion = if ($versionNode) { $versionNode.InnerText } else { $null }
          if ($projectVersion -ne $version) {
            throw "Release tag $env:RELEASE_TAG does not match ApplicationDisplayVersion in src/Rambl.csproj."
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0 -or !(Test-Path $compiler)) {
              throw 'Inno Setup 6 compiler is unavailable.'
            }
          }

      - name: Build self-contained installer
        shell: pwsh
        run: .\rambl.ps1 setup

      - name: Attach installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:RELEASE_TAG artifacts/Rambl-Setup.exe --clobber
