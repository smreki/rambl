<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <defs>
    <style>
      .bar {
        fill: #0d7364;
        rx: 10px;
        ry: 10px;
        transform-box: fill-box;
        transform-origin: center;
        animation: pulseWave 1.6s ease-in-out infinite alternate;
      }

      /* Staggered animation delays for wave-like effect */
      .bar-1 { animation-delay: 0.0s; }
      .bar-2 { animation-delay: 0.25s; }
      .bar-3 { animation-delay: 0.5s; }
      .bar-4 { animation-delay: 0.2s; }
      .bar-5 { animation-delay: 0.4s; }
      .bar-6 { animation-delay: 0.1s; }

      /* Animates strictly downward/inward from full height (1) to smaller scale (0.2 - 0.4) */
      @keyframes pulseWave {
        0% {
          transform: scaleY(1);
        }
        50% {
          transform: scaleY(0.3);
        }
        100% {
          transform: scaleY(1);
        }
      }
    </style>
  </defs>

  <rect class="bar bar-1" x="10"  y="110" width="20" height="60" />

  <rect class="bar bar-2" x="50"  y="60"  width="20" height="160" />

  <rect class="bar bar-3" x="90"  y="20"  width="20" height="240" />

  <rect class="bar bar-4" x="130" y="80"  width="20" height="120" />

  <rect class="bar bar-5" x="170" y="45"  width="20" height="190" />

  <rect class="bar bar-6" x="210" y="110" width="20" height="60" />
</svg>
